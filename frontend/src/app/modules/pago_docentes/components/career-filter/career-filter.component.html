<div class="career-filter">
  <mat-form-field appearance="outline">
    <mat-label>Carrera</mat-label>
    <input
      matInput
      [formControl]="control()"
      autocomplete="off"
      role="combobox"
      aria-autocomplete="list"
      aria-controls="career-filter-suggestions"
      [attr.aria-expanded]="open()"
      [attr.aria-activedescendant]="activeOptionId()"
      (focus)="update()"
      (input)="update()"
      (blur)="close()"
      (keydown)="onKeydown($event)"
    />
  </mat-form-field>
  @if (open()) {
    <div
      id="career-filter-suggestions"
      class="career-suggestions"
      role="listbox"
      aria-label="Carreras sugeridas"
    >
      @for (group of groups(); track group.name) {
        <div class="career-suggestion-group" role="group" [attr.aria-label]="group.name">
          <span class="career-suggestion-heading">{{ group.name }}</span>
          @for (career of group.careers; track career.id) {
            <button
              [id]="'career-filter-option-' + career.id"
              class="career-suggestion"
              type="button"
              role="option"
              [attr.aria-selected]="activeOptionId() === 'career-filter-option-' + career.id"
              (pointerdown)="$event.preventDefault()"
              (click)="select(career)"
            >
              {{ career.nombre }}
            </button>
          }
        </div>
      }
      @if (groups().length === 0) {
        <p class="career-suggestions-empty">No hay carreras que coincidan</p>
      }
    </div>
  }
</div>
